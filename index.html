<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aegis AI - Security Agent</title>
    <style>
        :root {
            --bg-sidebar: #070a12;
            --bg-main: #0b0f19;
            --bg-input: #101728;
            --border-color: rgba(255, 255, 255, 0.08);
            --border-hover: rgba(255, 255, 255, 0.15);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-color: #3b82f6;
            --accent-hover: #2563eb;
            --chip-bg: rgba(255, 255, 255, 0.03);
            --chip-hover: rgba(255, 255, 255, 0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-primary);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Sidebar Styles */
        .sidebar {
            width: 260px;
            background-color: var(--bg-sidebar);
            border-right: 1px solid var(--border-color);
            padding: 20px 16px;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }

        .logo {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 24px;
            padding: 0 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .new-thread-btn {
            background-color: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 10px 12px;
            border-radius: 8px;
            font-size: 0.875rem;
            font-weight: 500;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: background-color 0.2s, border-color 0.2s;
            margin-bottom: 24px;
        }

        .new-thread-btn:hover {
            background-color: rgba(255, 255, 255, 0.03);
            border-color: var(--border-hover);
        }

        .shortcut {
            color: var(--text-secondary);
            font-size: 0.75rem;
            background: rgba(255, 255, 255, 0.05);
            padding: 2px 6px;
            border-radius: 4px;
            font-family: monospace;
        }

        .nav-section {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .nav-item {
            color: var(--text-secondary);
            text-decoration: none;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 0.875rem;
            transition: all 0.2s;
            cursor: pointer;
        }

        .nav-item:hover {
            background-color: rgba(255, 255, 255, 0.03);
            color: var(--text-primary);
        }

        /* Main Chat Area Styles */
        .main-chat {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
            position: relative;
        }

        .hero-section {
            text-align: center;
            margin-bottom: 40px;
        }

        .hero-title {
            font-size: 2.25rem;
            font-weight: 500;
            margin-bottom: 12px;
            background: linear-gradient(to right, #fff, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero-subtitle {
            font-size: 1.1rem;
            color: var(--text-secondary);
            font-weight: 400;
        }

        /* Input Container Styles */
        .input-container {
            width: 100%;
            max-width: 720px;
            background-color: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 16px;
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.2);
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .input-container:focus-within {
            border-color: rgba(255, 255, 255, 0.2);
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.4);
        }

        .chat-input {
            width: 100%;
            background: transparent;
            border: none;
            color: var(--text-primary);
            font-size: 1rem;
            outline: none;
            resize: none;
            min-height: 44px;
            margin-bottom: 12px;
            font-family: inherit;
        }

        .chat-input::placeholder {
            color: #64748b;
        }

        .input-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .pill-group {
            display: flex;
            gap: 8px;
        }

        .pill-btn {
            background-color: var(--chip-bg);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .pill-btn:hover {
            background-color: var(--chip-hover);
            color: var(--text-primary);
        }

        .submit-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background-color: var(--accent-color);
            border: none;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .submit-btn:hover {
            background-color: var(--accent-hover);
        }

        /* Quick Action Chips */
        .quick-actions {
            display: flex;
            gap: 12px;
            margin-top: 32px;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 800px;
        }

        .action-chip {
            background-color: var(--chip-bg);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            padding: 10px 16px;
            border-radius: 12px;
            font-size: 0.875rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .action-chip:hover {
            background-color: var(--chip-hover);
            border-color: var(--border-hover);
            color: var(--text-primary);
            transform: translateY(-1px);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .sidebar {
                display: none;
            }
            .hero-title {
                font-size: 1.75rem;
            }
            .hero-subtitle {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>

    <!-- Left Sidebar -->
    <aside class="sidebar">
        <div class="logo">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: var(--accent-color);"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
            Aegis AI
        </div>
        
        <button class="new-thread-btn">
            <span>New Thread</span>
            <span class="shortcut">Ctrl K</span>
        </button>

        <nav class="nav-section">
            <a class="nav-item">💬 Security Audit</a>
            <a class="nav-item">🔍 Code Scanner</a>
            <a class="nav-item">🚨 Vulnerabilities</a>
        </nav>
    </aside>

    <!-- Main Chat Container -->
    <main class="main-chat">
        
        <!-- Hero Section -->
        <div class="hero-section">
            <h1 class="hero-title">Good Morning</h1>
            <p class="hero-subtitle">How can Aegis Zero help secure your repository today?</p>
        </div>

        <!-- Input Box -->
        <div class="input-container">
            <textarea class="chat-input" placeholder="Ask Aegis Zero anything... (e.g. Scan vulnerable_app.py)" rows="1"></textarea>
            
            <div class="input-footer">
                <div class="pill-group">
                    <button class="pill-btn">
                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                        Search
                    </button>
                    <button class="pill-btn">
                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg>
                        TrueForge
                    </button>
                </div>
                
                <button class="submit-btn" aria-label="Send message">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
                </button>
            </div>
        </div>

        <!-- Quick Actions -->
        <div class="quick-actions">
            <button class="action-chip">🛡️ Run Security Scan</button>
            <button class="action-chip">⚙️ Review Qodo Quality</button>
            <button class="action-chip">🚀 Open Pull Request</button>
        </div>

    </main>

    <script>
        const submitBtn = document.querySelector('.submit-btn');
        const chatInput = document.querySelector('.chat-input');

        submitBtn.addEventListener('click', () => {
            const message = chatInput.value.trim();
            if (message) {
                // Simulate sending the message for the demo
                alert(`Aegis Zero received: "${message}"\n\n(Agent processing simulated for demo...)`);
                chatInput.value = ''; // Clears the box after sending
            }
        });

        // Make the Enter key work too
        chatInput.addEventListener('keypress', function (e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                submitBtn.click();
            }
        });
    </script>
</body>
</html>
