<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aegis AI - Security Agent</title>
    <style>
        :root {
            --bg-sidebar: #070a12;
            --bg-main: #0b0f19;
            --bg-input: #101728;
            --border-color: rgba(255, 255, 255, 0.08);
            --border-hover: rgba(255, 255, 255, 0.15);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-color: #3b82f6;
            --accent-hover: #2563eb;
            --chip-bg: rgba(255, 255, 255, 0.03);
            --chip-hover: rgba(255, 255, 255, 0.08);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-primary);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        .sidebar {
            width: 260px;
            background-color: var(--bg-sidebar);
            border-right: 1px solid var(--border-color);
            padding: 20px 16px;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }

        .logo {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 24px;
            padding: 0 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .new-thread-btn {
            background-color: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 10px 12px;
            border-radius: 8px;
            font-size: 0.875rem;
            font-weight: 500;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            margin-bottom: 24px;
        }

        .nav-section { display: flex; flex-direction: column; gap: 4px; }
        .nav-item {
            color: var(--text-secondary);
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 0.875rem;
            cursor: pointer;
        }
        .nav-item:hover { background-color: rgba(255, 255, 255, 0.03); color: var(--text-primary); }

        .main-chat {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .hero-section { text-align: center; margin-bottom: 40px; }
        .hero-title {
            font-size: 2.25rem;
            font-weight: 500;
            margin-bottom: 12px;
            background: linear-gradient(to right, #fff, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .hero-subtitle { font-size: 1.1rem; color: var(--text-secondary); }

        .input-container {
            width: 100%;
            max-width: 720px;
            background-color: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 16px;
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.2);
        }

        .chat-input {
            width: 100%;
            background: transparent;
            border: none;
            color: var(--text-primary);
            font-size: 1rem;
            outline: none;
            resize: none;
            min-height: 44px;
            margin-bottom: 12px;
        }

        .input-footer { display: flex; justify-content: space-between; align-items: center; }
        .pill-group { display: flex; gap: 8px; }
        .pill-btn {
            background-color: var(--chip-bg);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            cursor: pointer;
        }
        
        .submit-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background-color: var(--accent-color);
            border: none;
            color: white;
            cursor: pointer;
        }

        .quick-actions {
            display: flex;
            gap: 12px;
            margin-top: 32px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .action-chip {
            background-color: var(--chip-bg);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            padding: 10px 16px;
            border-radius: 12px;
            font-size: 0.875rem;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <aside class="sidebar">
        <div class="logo">Aegis AI</div>
        <button class="new-thread-btn"><span>New Thread</span></button>
        <nav class="nav-section">
            <a class="nav-item">💬 Security Audit</a>
            <a class="nav-item">🔍 Code Scanner</a>
            <a class="nav-item">🚨 Vulnerabilities</a>
        </nav>
    </aside>
    <main class="main-chat">
        <div class="hero-section">
            <h1 class="hero-title">Good Morning</h1>
            <p class="hero-subtitle">How can Aegis Zero help secure your repository today?</p>
        </div>
        <div class="input-container">
            <textarea class="chat-input" placeholder="Ask Aegis Zero anything... (e.g. Scan vulnerable_app.py)" rows="1"></textarea>
            <div class="input-footer">
                <div class="pill-group">
                    <button class="pill-btn">Search</button>
                    <button class="pill-btn">TrueForge</button>
                </div>
                <button class="submit-btn">➔</button>
            </div>
        </div>
        <div class="quick-actions">
            <button class="action-chip">🛡️ Run Security Scan</button>
            <button class="action-chip">⚙️ Review Qodo Quality</button>
            <button class="action-chip">🚀 Open Pull Request</button>
        </div>
    </main>
</body>
</html>
